[project]
name = "aigc-detector"
version = "0.1.0"
description = "Robust AI-generated image detection using camera-pipeline evidence"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.4",
    "open_clip_torch>=2.24",
    "timm>=1.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "omegaconf>=2.3",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "huggingface-hub>=0.26",
    "pyarrow>=17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provenance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
