[project]
name = "aigc-detector"
version = "0.1.0"
description = "Robust AI-generated image detection using camera-pipeline evidence"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
dependencies = [
    # Pin the CUDA generation used by the NUS SoC cluster. Unbounded PyPI
    # resolution currently selects CUDA 13 on Linux, but the cluster driver is
    # CUDA 12.9 and cannot load that build.
    "torch==2.8.0",
    "torchvision==0.23.0",
    "open_clip_torch>=2.24",
    "timm>=1.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "omegaconf>=2.3",
    "tqdm>=4.66",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "huggingface-hub>=0.26",
    "pyarrow>=17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provenance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
